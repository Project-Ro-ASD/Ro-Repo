name: Publish immutable candidate snapshot to Pages storage

"on":
  workflow_dispatch:
    inputs:
      candidate_run:
        description: Exact successful candidate snapshot workflow run ID
        required: true
        type: string
      snapshot_id:
        description: Exact immutable snapshot ID, e.g. repo-f44-20260920-001
        required: true
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: ro-repo-pages-storage
  cancel-in-progress: false

jobs:
  publish-pages-storage:
    runs-on: ubuntu-24.04
    container:
      image: fedora:44
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      CANDIDATE_RUN: ${{ inputs.candidate_run }}
      SNAPSHOT_ID: ${{ inputs.snapshot_id }}
      CANDIDATE_ARTIFACT: candidate-snapshot-${{ inputs.snapshot_id }}-${{ inputs.candidate_run }}
    steps:
      - name: Checkout trusted Ro-Repo source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: source

      - name: Install verification and publication tools
        run: |
          dnf -y install \
            gh jq git python3 python3-jsonschema \
            rpm gnupg2

      - name: Resolve exact candidate run and immutable artifact
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_RUN" =~ ^[1-9][0-9]*$ ]]
          [[ "$SNAPSHOT_ID" =~ ^repo-f44-[0-9]{8}-[0-9]{3}$ ]]

          run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${CANDIDATE_RUN}")"
          [[ "$(jq -r '.repository.full_name' <<<"$run_json")" == "$GITHUB_REPOSITORY" ]]
          [[ "$(jq -r '.path' <<<"$run_json")" == ".github/workflows/build-candidate-snapshot.yml" ]]
          [[ "$(jq -r '.event' <<<"$run_json")" == "workflow_dispatch" ]]
          [[ "$(jq -r '.conclusion' <<<"$run_json")" == "success" ]]
          [[ "$(jq -r '.head_branch' <<<"$run_json")" == "main" ]]
          [[ "$(jq -r '.head_sha' <<<"$run_json")" =~ ^[0-9a-f]{40}$ ]]

          artifacts_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${CANDIDATE_RUN}/artifacts?per_page=100")"
          matches="$(jq --arg name "$CANDIDATE_ARTIFACT" '[.artifacts[] | select(.name == $name and .expired == false)] | length' <<<"$artifacts_json")"
          [[ "$matches" -eq 1 ]]
          artifact_id="$(jq -r --arg name "$CANDIDATE_ARTIFACT" '.artifacts[] | select(.name == $name and .expired == false) | .id' <<<"$artifacts_json")"
          artifact_digest="$(jq -r --arg name "$CANDIDATE_ARTIFACT" '.artifacts[] | select(.name == $name and .expired == false) | .digest' <<<"$artifacts_json")"
          [[ "$artifact_id" =~ ^[1-9][0-9]*$ ]]
          [[ "$artifact_digest" =~ ^sha256:[0-9a-f]{64}$ ]]

          candidate_root="$RUNNER_TEMP/candidate/$SNAPSHOT_ID"
          mkdir -p "$candidate_root"
          gh run download "$CANDIDATE_RUN" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$CANDIDATE_ARTIFACT" \
            --dir "$candidate_root"

          printf 'CANDIDATE_ROOT=%s\n' "$candidate_root" >> "$GITHUB_ENV"
          printf 'CANDIDATE_ARTIFACT_ID=%s\n' "$artifact_id" >> "$GITHUB_ENV"
          printf 'CANDIDATE_ARTIFACT_DIGEST=%s\n' "$artifact_digest" >> "$GITHUB_ENV"

      - name: Verify signed production candidate
        shell: bash
        run: |
          set -euo pipefail
          verify_home="$RUNNER_TEMP/candidate-verify-gnupg"
          mkdir -m 700 "$verify_home"
          metadata_key="$CANDIDATE_ROOT/keys/REPODATA-GPG-KEY-ro-asd"
          [[ -f "$metadata_key" && ! -L "$metadata_key" ]]
          GNUPGHOME="$verify_home" gpg --batch --import "$metadata_key"

          source/tools/ro-repo verify-production-candidate \
            --snapshot "$CANDIDATE_ROOT" \
            --gnupghome "$verify_home" \
            --candidate-run "$CANDIDATE_RUN"

          GNUPGHOME="$verify_home" gpgconf --kill gpg-agent >/dev/null 2>&1 || true
          rm -rf "$verify_home"

      - name: Checkout persistent Pages storage
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: pages-storage
          path: pages-site
          fetch-depth: 1
          persist-credentials: true

      - name: Stage immutable snapshot into Pages storage
        shell: bash
        run: |
          set -euo pipefail
          source/tools/ro-repo stage-pages-snapshot \
            --snapshot "$CANDIDATE_ROOT" \
            --site-root pages-site

          git -C pages-site config user.name "Ro-Repo Pages Publisher"
          git -C pages-site config user.email "actions@users.noreply.github.com"
          git -C pages-site add .nojekyll "snapshots/fedora/44/$SNAPSHOT_ID"

          if git -C pages-site diff --cached --quiet; then
            echo "Pages storage already contains the exact immutable snapshot."
            exit 0
          fi

          git -C pages-site commit -m "publish: $SNAPSHOT_ID from candidate run $CANDIDATE_RUN"
          git -C pages-site push origin HEAD:pages-storage

      - name: Publication summary
        shell: bash
        run: |
          {
            echo "## Immutable Pages storage publication"
            echo
            echo "- snapshot: `$SNAPSHOT_ID`"
            echo "- candidate run: `$CANDIDATE_RUN`"
            echo "- candidate artifact id: `$CANDIDATE_ARTIFACT_ID`"
            echo "- candidate artifact digest: `$CANDIDATE_ARTIFACT_DIGEST`"
            echo "- storage path: `/snapshots/fedora/44/$SNAPSHOT_ID/`"
            echo
            echo "No beta or stable channel pointer was changed."
          } >> "$GITHUB_STEP_SUMMARY"
