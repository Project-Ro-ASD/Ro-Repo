name: Accept pinned producer component
"on":
  workflow_dispatch:
    inputs:
      repository:
        description: Exact allowlisted owner/repository
        required: true
        type: string
      tag:
        description: Exact release tag, never latest
        required: true
        type: string
      commit:
        description: Exact 40-character source commit SHA
        required: true
        type: string
      release_id:
        description: Exact numeric GitHub release ID
        required: true
        type: string
permissions:
  contents: read
  attestations: read
  actions: read
jobs:
  accept:
    runs-on: ubuntu-24.04
    container: fedora:44
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install acceptance tools
        shell: bash
        run: scripts/install_acceptance_tools.sh
      - name: Initialize provisional acceptance report
        shell: bash
        env:
          PRODUCER: ${{ inputs.repository }}
          TAG: ${{ inputs.tag }}
          COMMIT: ${{ inputs.commit }}
          RELEASE_ID: ${{ inputs.release_id }}
        run: |
          set -euo pipefail
          python3 scripts/init_acceptance_report.py \
            --repository "$PRODUCER" \
            --tag "$TAG" \
            --commit "$COMMIT" \
            --release-id "$RELEASE_ID" \
            --output acceptance-report-v1.json
      - name: Download and verify exact release identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCER: ${{ inputs.repository }}
          TAG: ${{ inputs.tag }}
          COMMIT: ${{ inputs.commit }}
          RELEASE_ID: ${{ inputs.release_id }}
        run: |
          set -euo pipefail
          cat << 'EOF' > verify_identity.py
          import yaml, json, sys, os, subprocess, pathlib
          sys.path.insert(0, "tools")
          import ro_repo

          PRODUCER = os.environ["PRODUCER"]
          TAG = os.environ["TAG"]
          COMMIT = os.environ["COMMIT"]
          RELEASE_ID = os.environ["RELEASE_ID"]

          identity = ro_repo.normalize_acceptance_identity({
              "source_repository": PRODUCER,
              "release_tag": TAG,
              "source_commit": COMMIT,
              "release_id": RELEASE_ID,
              "workflow_run": None,
          })

          default_excepthook = sys.excepthook
          def report_unexpected(error_type, error, traceback):
              if not os.path.exists("acceptance-report-v1.json"):
                  internal = ro_repo.ContractError(
                      "unexpected internal acceptance error",
                      code="INTERNAL_ACCEPTANCE_ERROR",
                      stage="release-identity",
                      hint="Inspect the acceptance job logs and retry after correcting the internal failure.",
                  )
                  ro_repo.write_acceptance_report("acceptance-report-v1.json", "rejected", identity, internal)
              default_excepthook(error_type, error, traceback)
          sys.excepthook = report_unexpected

          def reject(message, code, stage, expected=None, received=None, hint=None):
              error = ro_repo.ContractError(
                  message, code=code, stage=stage, expected=expected,
                  received=received, hint=hint,
              )
              ro_repo.write_acceptance_report("acceptance-report-v1.json", "rejected", identity, error)
              raise error

          print("Verifying allowlist before API requests...")
          config = ro_repo.load_producer_registry("config/producers-v2.json")
          repositories = {
              producer.get("repository")
              for producer in config.get("producers", [])
          }
          if PRODUCER not in repositories:
              reject(f"Producer {PRODUCER} is not allowlisted.", "PRODUCER_NOT_ALLOWLISTED", "allowlist", received=PRODUCER, hint="Add the producer through the reviewed producer-registry process before retrying.")

          if len(COMMIT) != 40:
              reject("Commit length is not 40", "TAG_COMMIT_MISMATCH", "tag-commit", expected="40-character commit SHA", received=COMMIT, hint="Dispatch the job with the exact commit referenced by the release tag.")

          def gh_api(path):
              return json.loads(subprocess.check_output(["gh", "api", path]))

          commit_data = gh_api(f"repos/{PRODUCER}/commits/{TAG}")
          if commit_data["sha"] != COMMIT:
              reject("Tag commit mismatch", "TAG_COMMIT_MISMATCH", "tag-commit", expected=COMMIT, received=commit_data["sha"], hint="Use the exact commit referenced by the immutable release tag.")

          release_data = gh_api(f"repos/{PRODUCER}/releases/tags/{TAG}")
          if str(release_data["id"]) != RELEASE_ID:
              reject("Release ID mismatch", "RELEASE_ID_MISMATCH", "release-id", expected=RELEASE_ID, received=release_data["id"], hint="Use the numeric ID of the exact GitHub release.")
          if release_data["tag_name"] != TAG:
              reject("Release tag mismatch", "MANIFEST_IDENTITY_MISMATCH", "release-identity", expected=TAG, received=release_data["tag_name"], hint="Use the exact immutable release tag.")
          if release_data.get("draft") is not False:
              reject("Release is still draft", "MANIFEST_IDENTITY_MISMATCH", "release-identity", expected=False, received=release_data.get("draft"), hint="Accept only a published immutable release.")
          if release_data.get("immutable") is not True:
              reject("Release is not natively immutable", "MANIFEST_IDENTITY_MISMATCH", "release-identity", expected=True, received=release_data.get("immutable"), hint="Enable GitHub immutable releases before publishing producer artifacts.")

          release_asset_names = {asset.get("name") for asset in release_data.get("assets", [])}

          print("Release verified. Downloading...")
          os.makedirs("incoming", exist_ok=True)
          os.makedirs("accepted", exist_ok=True)
          subprocess.check_call(["gh", "release", "download", TAG, "--repo", PRODUCER, "--dir", "incoming"])

          if not os.path.isfile("incoming/component-artifact-manifest-v1.json"):
              reject("Missing manifest", "ARTIFACT_SET_MISMATCH", "artifact-set", expected="component-artifact-manifest-v1.json", hint="Publish the required manifest in the immutable release.")

          downloaded = {path.name for path in pathlib.Path("incoming").iterdir() if path.is_file()}
          if downloaded != release_asset_names:
              reject(
                  "Downloaded release inventory differs from GitHub release inventory",
                  "ARTIFACT_SET_MISMATCH",
                  "artifact-set",
                  expected=sorted(release_asset_names),
                  received=sorted(downloaded),
              )

          with open("incoming/component-artifact-manifest-v1.json") as f:
              manifest = json.load(f)
          manifest_identity = ro_repo.normalize_acceptance_identity(manifest)
          identity["workflow_run"] = manifest_identity["workflow_run"]

          if manifest["source_repository"] != PRODUCER:
              reject("Manifest source_repository mismatch", "MANIFEST_IDENTITY_MISMATCH", "manifest-identity", expected=PRODUCER, received=manifest["source_repository"])
          if manifest["release_tag"] != TAG:
              reject("Manifest release_tag mismatch", "MANIFEST_IDENTITY_MISMATCH", "manifest-identity", expected=TAG, received=manifest["release_tag"])
          if manifest["source_commit"] != COMMIT:
              reject("Manifest source_commit mismatch", "TAG_COMMIT_MISMATCH", "manifest-identity", expected=COMMIT, received=manifest["source_commit"])
          if str(manifest["release_id"]) != RELEASE_ID:
              reject("Manifest release_id mismatch", "RELEASE_ID_MISMATCH", "manifest-identity", expected=RELEASE_ID, received=manifest["release_id"])

          try:
              component_policy = ro_repo.resolve_component_policy(
                  config, PRODUCER, manifest.get("component")
              )
          except ro_repo.ContractError as error:
              reject(
                  str(error),
                  error.code,
                  error.stage,
                  expected=error.expected,
                  received=error.received,
                  hint=error.hint,
              )

          expected_release_assets = {
              item["filename"] for item in manifest["artifacts"]
          } | {"SHA256SUMS", "component-artifact-manifest-v1.json"}
          if manifest.get("sbom"):
              sbom_filename = manifest["sbom"].get("filename") if isinstance(manifest["sbom"], dict) else None
              if not sbom_filename:
                  reject(
                      "SBOM metadata lacks a filename",
                      "ARTIFACT_SET_MISMATCH",
                      "artifact-set",
                      expected="sbom.filename",
                      received=manifest.get("sbom"),
                  )
              expected_release_assets.add(sbom_filename)
          if release_asset_names != expected_release_assets:
              reject(
                  "Release asset inventory mismatch",
                  "ARTIFACT_SET_MISMATCH",
                  "artifact-set",
                  expected=sorted(expected_release_assets),
                  received=sorted(release_asset_names),
                  hint="Publish exactly the manifest-declared RPMs plus required metadata assets.",
              )

          workflow_path = component_policy["trusted_signer_workflow"]
          run_id = manifest_identity["workflow_run"]
          if run_id is None:
              reject("Manifest workflow_run is not a valid numeric run ID", "MANIFEST_IDENTITY_MISMATCH", "manifest-identity", expected="positive numeric workflow run ID", received=manifest.get("workflow_run"))
          run_data = gh_api(f"repos/{PRODUCER}/actions/runs/{run_id}")

          if run_data["head_repository"]["full_name"] != PRODUCER:
              reject("Workflow run repository mismatch", "PROVENANCE_MISMATCH", "provenance", expected=PRODUCER, received=run_data["head_repository"]["full_name"])
          if run_data["head_sha"] != COMMIT:
              reject("Workflow run commit mismatch", "PROVENANCE_MISMATCH", "provenance", expected=COMMIT, received=run_data["head_sha"])
          if run_data["event"] != "push":
              reject("Workflow run event mismatch", "PROVENANCE_MISMATCH", "provenance", expected="push", received=run_data["event"])
          if run_data.get("head_branch") != TAG:
              reject("Workflow run tag ref mismatch", "PROVENANCE_MISMATCH", "provenance", expected=TAG, received=run_data.get("head_branch"))

          # Aggregate run conclusion may change after a rerun. Cryptographic
          # provenance is bound below to one verified run attempt instead.
          # gh attestation uses the repo prefix for workflow matching, so does our trusted_signer_workflow
          # The run_data["path"] from GitHub API is usually just '.github/workflows/something.yml'
          # We check if PRODUCER + "/" + run_data["path"] matches exactly
          actual_workflow_identity = f"{PRODUCER}/{run_data['path']}"
          if actual_workflow_identity != workflow_path:
              reject("Workflow identity mismatch", "PROVENANCE_MISMATCH", "provenance", expected=workflow_path, received=actual_workflow_identity, hint="Create the release only through the trusted producer workflow.")

          print("Manifest and workflow run identity matches.")
          with open("workflow.txt", "w") as f:
              f.write(workflow_path)
          EOF
          python3 verify_identity.py

          python3 - <<'PY'
          import json, os, pathlib, sys
          sys.path.insert(0, "tools")
          import ro_repo

          manifest_path = pathlib.Path("incoming/component-artifact-manifest-v1.json")
          manifest = json.loads(manifest_path.read_text())
          identity = ro_repo.normalize_acceptance_identity(manifest)
          try:
              config = ro_repo.load_producer_registry("config/producers-v2.json")
              policy = ro_repo.resolve_component_policy(
                  config, manifest["source_repository"], manifest["component"]
              )
              verified = ro_repo.verify_attestations(
                  manifest,
                  pathlib.Path("incoming"),
                  manifest_path,
                  policy["trusted_signer_workflow"],
              )
              invocations = {
                  (item["workflow_run"], item["workflow_attempt"])
                  for item in verified.values()
              }
              if len(invocations) != 1:
                  raise ro_repo.ContractError(
                      f"expected one attested workflow attempt, got {sorted(invocations)}",
                      code="PROVENANCE_MISMATCH",
                      stage="provenance",
                      expected="one exact workflow run attempt",
                      received=sorted(invocations),
                  )
              run_id, attempt = next(iter(invocations))
              pathlib.Path("attested-invocation.json").write_text(
                  json.dumps({"run_id": run_id, "attempt": attempt})
              )
          except ro_repo.ContractError as error:
              ro_repo.write_acceptance_report(
                  "acceptance-report-v1.json", "rejected", identity, error
              )
              raise
          except Exception as error:
              internal = ro_repo.ContractError(
                  f"unexpected provenance precheck error: {type(error).__name__}",
                  code="INTERNAL_ACCEPTANCE_ERROR",
                  stage="provenance",
                  hint="Inspect the provenance precheck logs and retry after correcting the internal failure.",
              )
              ro_repo.write_acceptance_report(
                  "acceptance-report-v1.json", "rejected", identity, internal
              )
              raise
          PY

          python3 scripts/verify_attested_attempt.py \
            --producer "$PRODUCER" \
            --tag "$TAG" \
            --commit "$COMMIT" \
            --workflow "$(cat workflow.txt)" \
            --invocation attested-invocation.json \
            --manifest incoming/component-artifact-manifest-v1.json \
            --report acceptance-report-v1.json

          scripts/query_fedora_package_names.sh fedora-44-package-names.txt
          tools/ro-repo accept-package --manifest incoming/component-artifact-manifest-v1.json --artifacts incoming --accepted accepted --fedora-names fedora-44-package-names.txt --report acceptance-report-v1.json --expected-repository "$PRODUCER" --expected-tag "$TAG" --expected-commit "$COMMIT" --expected-release-id "$RELEASE_ID"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: success()
        with:
          name: accepted-component-${{ github.run_id }}
          path: accepted/
          retention-days: 30
          if-no-files-found: error
      - name: Write acceptance job summary
        if: always()
        shell: bash
        run: |
          if [[ -f acceptance-report-v1.json ]]; then
            python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          report = json.load(open("acceptance-report-v1.json", encoding="utf-8"))
          print(f"## Acceptance {report['result'].upper()}")
          print(f"- Producer: `{report.get('producer_repository') or 'unavailable'}`")
          print(f"- Tag: `{report.get('release_tag') or 'unavailable'}`")
          print(f"- Failed check: `{report.get('failed_stage') or 'none'}`")
          print(f"- Error code: `{report.get('error_code') or 'none'}`")
          print(f"- Remediation: {report.get('remediation_hint') or 'none'}")
          PY
          else
            printf '## Acceptance REJECTED\n- Report was not produced because setup failed before acceptance reporting.\n' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload acceptance report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: acceptance-report-${{ github.run_id }}
          path: acceptance-report-v1.json
          retention-days: 30
          if-no-files-found: warn
  sign:
    needs: accept
    runs-on: ubuntu-24.04
    container: fedora:44
    environment:
      name: repo-production-signing
    concurrency:
      group: ro-repo-production-rpm-signing
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install production RPM signing tools
        run: dnf -y install gnupg2 python3 python3-jsonschema rpm rpm-sign
      - name: Download accepted component from this workflow run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: accepted-component-${{ github.run_id }}
          path: accepted
      - name: Sign accepted component with the isolated RPM subkey
        shell: bash
        env:
          RO_REPO_RPM_SIGNING_SUBKEY_B64: ${{ secrets.RO_REPO_RPM_SIGNING_SUBKEY_B64 }}
          RO_REPO_RPM_SIGNING_PASSPHRASE: ${{ secrets.RO_REPO_RPM_SIGNING_PASSPHRASE }}
        run: |
          set -euo pipefail
          set +x
          signing_tmp=""
          signing_home=""
          key_file=""
          passphrase_file=""
          cleanup() {
            set +e
            if [[ -n "$signing_home" ]]; then
              GNUPGHOME="$signing_home" gpgconf --kill gpg-agent >/dev/null 2>&1
            fi
            if [[ -n "$key_file" ]]; then rm -f -- "$key_file"; fi
            if [[ -n "$passphrase_file" ]]; then rm -f -- "$passphrase_file"; fi
            if [[ -n "$signing_tmp" ]]; then rm -rf -- "$signing_tmp"; fi
          }
          trap cleanup EXIT

          signing_tmp="$(mktemp -d)"
          chmod 700 "$signing_tmp"
          signing_home="$signing_tmp/gnupg"
          key_file="$signing_tmp/rpm-signing-subkey.asc"
          passphrase_file="$signing_tmp/passphrase"
          mkdir -m 700 "$signing_home"
          umask 077
          printf '%s' "$RO_REPO_RPM_SIGNING_SUBKEY_B64" | base64 --decode > "$key_file"
          printf '%s' "$RO_REPO_RPM_SIGNING_PASSPHRASE" > "$passphrase_file"
          chmod 600 "$key_file" "$passphrase_file"
          unset RO_REPO_RPM_SIGNING_SUBKEY_B64 RO_REPO_RPM_SIGNING_PASSPHRASE
          GNUPGHOME="$signing_home" gpg --batch --import "$key_file"

          expected_fingerprint="$(awk -F= '$1 == "RPM_SIGNING" {print $2}' keys/production/production-fingerprints.txt)"
          tools/ro-repo sign-accepted-component \
            --accepted accepted \
            --output signed \
            --gnupghome "$signing_home" \
            --key-id "$expected_fingerprint" \
            --workflow-run "$GITHUB_RUN_ID" \
            --passphrase-file "$passphrase_file"
      - name: Upload signed component and signing evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: signed-component-${{ github.run_id }}
          path: signed/
          retention-days: 30
          if-no-files-found: error
