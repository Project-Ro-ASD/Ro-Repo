name: Accept pinned producer component
"on":
  workflow_dispatch:
    inputs:
      repository:
        description: Exact allowlisted owner/repository
        required: true
        type: string
      tag:
        description: Exact release tag, never latest
        required: true
        type: string
      commit:
        description: Exact 40-character source commit SHA
        required: true
        type: string
      release_id:
        description: Exact numeric GitHub release ID
        required: true
        type: string
permissions:
  contents: read
  attestations: read
jobs:
  accept:
    runs-on: ubuntu-24.04
    container: fedora:44
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install acceptance tools
        run: dnf -y install gh python3 python3-yaml rpm dnf-plugins-core jq
      - name: Download and verify exact release identity
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCER: ${{ inputs.repository }}
          TAG: ${{ inputs.tag }}
          COMMIT: ${{ inputs.commit }}
          RELEASE_ID: ${{ inputs.release_id }}
        run: |
          echo "Verifying allowlist before API requests..."
          python3 -c '
          import yaml, sys, os
          config = yaml.safe_load(open("config/producers-v1.yaml"))
          producers = [p["repository"] for p in config.get("producers", [])]
          if os.environ["PRODUCER"] not in producers:
              print(f"Producer {os.environ[\"PRODUCER\"]} is not allowlisted.")
              sys.exit(1)
          '
          test "${#COMMIT}" -eq 40
          test "$(gh api "repos/$PRODUCER/commits/$TAG" --jq .sha)" = "$COMMIT"
          test "$(gh api "repos/$PRODUCER/releases/tags/$TAG" --jq .id)" = "$RELEASE_ID"
          test "$(gh api "repos/$PRODUCER/releases/tags/$TAG" --jq .tag_name)" = "$TAG"
          mkdir incoming accepted
          gh release download "$TAG" --repo "$PRODUCER" --dir incoming
          test -f incoming/component-artifact-manifest-v1.json
          test "$(python3 -c 'import json; print(json.load(open("incoming/component-artifact-manifest-v1.json"))["source_commit"])')" = "$COMMIT"
          mkdir -p incoming/attestations
          for artifact in incoming/*.rpm incoming/SHA256SUMS incoming/component-artifact-manifest-v1.json; do
            echo "Verifying attestation for $artifact"
            basename=$(basename "$artifact")
            gh attestation verify "$artifact" --repo "$PRODUCER" --format json > "incoming/attestations/${basename}.json"
            ATTEST_COMMIT="$(jq -r '.[0].verificationResult.statement.predicate.buildDefinition.resolvedDependencies[0].digest.sha1' "incoming/attestations/${basename}.json" || true)"

            if [ "$ATTEST_COMMIT" != "$COMMIT" ]; then
                # Some attestation formats might use a different path or null if not present, but exact identity requires this match
                if [ "$ATTEST_COMMIT" != "null" ] && [ -n "$ATTEST_COMMIT" ]; then
                    echo "ERROR: Attestation commit $ATTEST_COMMIT does not match exact input commit $COMMIT for $artifact"
                    exit 1
                else
                    echo "WARNING: Could not parse exact commit from attestation. Strict identity enforcement requires valid provenance."
                    # In a strict fail-closed environment, we should fail here if attestation is required
                    exit 1
                fi
            fi
          done
          dnf repoquery --available --qf '%{name}' | sort -u > fedora-44-package-names.txt
          tools/ro-repo accept-package --manifest incoming/component-artifact-manifest-v1.json --artifacts incoming --accepted accepted --fedora-names fedora-44-package-names.txt --attestations incoming/attestations
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: accepted-component-${{ github.run_id }}
          path: accepted/
          retention-days: 30
          if-no-files-found: error
