name: Accept pinned producer component
"on":
  workflow_dispatch:
    inputs:
      repository:
        description: Exact allowlisted owner/repository
        required: true
        type: string
      tag:
        description: Exact release tag, never latest
        required: true
        type: string
      commit:
        description: Exact 40-character source commit SHA
        required: true
        type: string
      release_id:
        description: Exact numeric GitHub release ID
        required: true
        type: string
permissions:
  contents: read
  attestations: read
jobs:
  accept:
    runs-on: ubuntu-24.04
    container: fedora:44
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install acceptance tools
        run: dnf -y install gh python3 python3-yaml python3-jsonschema rpm dnf-plugins-core
      - name: Download and verify exact release identity
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCER: ${{ inputs.repository }}
          TAG: ${{ inputs.tag }}
          COMMIT: ${{ inputs.commit }}
          RELEASE_ID: ${{ inputs.release_id }}
        run: |
          cat << 'EOF' > verify_identity.py
          import yaml, json, sys, os, subprocess

          PRODUCER = os.environ["PRODUCER"]
          TAG = os.environ["TAG"]
          COMMIT = os.environ["COMMIT"]
          RELEASE_ID = os.environ["RELEASE_ID"]

          print("Verifying allowlist before API requests...")
          with open("config/producers-v1.yaml") as f:
              config = yaml.safe_load(f)

          producers = [p for p in config.get("producers", []) if p["repository"] == PRODUCER]
          if not producers:
              sys.exit(f"Producer {PRODUCER} is not allowlisted.")

          if len(COMMIT) != 40:
              sys.exit("Commit length is not 40")

          def gh_api(path):
              return json.loads(subprocess.check_output(["gh", "api", path]))

          commit_data = gh_api(f"repos/{PRODUCER}/commits/{TAG}")
          if commit_data["sha"] != COMMIT:
              sys.exit("Tag commit mismatch")

          release_data = gh_api(f"repos/{PRODUCER}/releases/tags/{TAG}")
          if str(release_data["id"]) != RELEASE_ID:
              sys.exit("Release ID mismatch")
          if release_data["tag_name"] != TAG:
              sys.exit("Release tag mismatch")

          print("Release verified. Downloading...")
          os.makedirs("incoming", exist_ok=True)
          os.makedirs("accepted", exist_ok=True)
          subprocess.check_call(["gh", "release", "download", TAG, "--repo", PRODUCER, "--dir", "incoming"])

          if not os.path.isfile("incoming/component-artifact-manifest-v1.json"):
              sys.exit("Missing manifest")

          with open("incoming/component-artifact-manifest-v1.json") as f:
              manifest = json.load(f)

          if manifest["source_repository"] != PRODUCER:
              sys.exit("Manifest source_repository mismatch")
          if manifest["release_tag"] != TAG:
              sys.exit("Manifest release_tag mismatch")
          if manifest["source_commit"] != COMMIT:
              sys.exit("Manifest source_commit mismatch")
          if str(manifest["release_id"]) != RELEASE_ID:
              sys.exit("Manifest release_id mismatch")

          workflow_path = producers[0]["trusted_signer_workflow"]
          run_id = manifest["workflow_run"]
          run_data = gh_api(f"repos/{PRODUCER}/actions/runs/{run_id}")

          if run_data["head_repository"]["full_name"] != PRODUCER:
              sys.exit("Workflow run repository mismatch")
          if run_data["head_sha"] != COMMIT:
              sys.exit("Workflow run commit mismatch")
          if run_data["conclusion"] != "success":
              sys.exit("Workflow run not success")

          # gh attestation uses the repo prefix for workflow matching, so does our trusted_signer_workflow
          # The run_data["path"] from GitHub API is usually just '.github/workflows/something.yml'
          # We check if PRODUCER + "/" + run_data["path"] matches exactly
          actual_workflow_identity = f"{PRODUCER}/{run_data['path']}"
          if actual_workflow_identity != workflow_path:
              sys.exit(f"Workflow identity mismatch: {actual_workflow_identity} vs {workflow_path}")

          print("Manifest and workflow run identity matches.")
          with open("workflow.txt", "w") as f:
              f.write(workflow_path)
          EOF
          python3 verify_identity.py
          dnf repoquery --available --qf '%{name}' | sort -u > fedora-44-package-names.txt
          tools/ro-repo accept-package --manifest incoming/component-artifact-manifest-v1.json --artifacts incoming --accepted accepted --fedora-names fedora-44-package-names.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: accepted-component-${{ github.run_id }}
          path: accepted/
          retention-days: 30
          if-no-files-found: error
