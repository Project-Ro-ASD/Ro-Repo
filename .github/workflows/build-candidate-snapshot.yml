name: Build immutable production candidate snapshot

"on":
  workflow_dispatch:
    inputs:
      signing_runs:
        description: Comma-separated exact successful Ro-Repo signing workflow run IDs
        required: true
        type: string
      snapshot_id:
        description: Exact immutable snapshot ID, e.g. repo-f44-20260920-001
        required: true
        type: string
      parent_snapshot:
        description: Optional exact parent snapshot ID
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: ro-repo-production-snapshot
  cancel-in-progress: false

jobs:
  build-candidate:
    runs-on: ubuntu-24.04
    container:
      image: fedora:44
    environment:
      name: repo-production-signing
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      SIGNING_RUNS: ${{ inputs.signing_runs }}
      SNAPSHOT_ID: ${{ inputs.snapshot_id }}
      PARENT_SNAPSHOT: ${{ inputs.parent_snapshot }}
    steps:
      - name: Checkout trusted Ro-Repo source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install snapshot tools
        run: |
          dnf -y install \
            gh jq python3 python3-jsonschema \
            rpm createrepo_c gnupg2

      - name: Resolve exact signing runs and download immutable inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SNAPSHOT_ID" =~ ^repo-f44-[0-9]{8}-[0-9]{3}$ ]]
          if [[ -n "$PARENT_SNAPSHOT" ]]; then
            [[ "$PARENT_SNAPSHOT" =~ ^repo-f44-[0-9]{8}-[0-9]{3}$ ]]
          fi

          IFS=',' read -ra RAW_RUNS <<< "$SIGNING_RUNS"
          [[ "${#RAW_RUNS[@]}" -ge 1 ]]
          mkdir -p components
          printf '{"schema_version":1,"runs":[' > snapshot-input-v1.json
          first=1
          declare -A seen=()

          for raw in "${RAW_RUNS[@]}"; do
            run_id="$(printf '%s' "$raw" | tr -d '[:space:]')"
            [[ "$run_id" =~ ^[1-9][0-9]*$ ]]
            [[ -z "${seen[$run_id]+x}" ]]
            seen[$run_id]=1

            run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}")"
            [[ "$(jq -r '.repository.full_name' <<<"$run_json")" == "$GITHUB_REPOSITORY" ]]
            [[ "$(jq -r '.path' <<<"$run_json")" == ".github/workflows/accept-component.yml" ]]
            [[ "$(jq -r '.event' <<<"$run_json")" == "workflow_dispatch" ]]
            [[ "$(jq -r '.conclusion' <<<"$run_json")" == "success" ]]
            [[ "$(jq -r '.head_branch' <<<"$run_json")" == "main" ]]
            [[ "$(jq -r '.head_sha' <<<"$run_json")" =~ ^[0-9a-f]{40}$ ]]

            mkdir -p "components/$run_id/accepted" "components/$run_id/signed"
            gh run download "$run_id" \
              --repo "$GITHUB_REPOSITORY" \
              --name "accepted-component-$run_id" \
              --dir "components/$run_id/accepted"
            gh run download "$run_id" \
              --repo "$GITHUB_REPOSITORY" \
              --name "signed-component-$run_id" \
              --dir "components/$run_id/signed"

            if [[ "$first" -eq 0 ]]; then printf ',' >> snapshot-input-v1.json; fi
            printf '{"run_id":%s}' "$run_id" >> snapshot-input-v1.json
            first=0
          done
          printf '%s\\n' ']}' >> snapshot-input-v1.json

          python3 - <<'PY'
          import json
          from pathlib import Path
          import sys
          sys.path.insert(0, "tools")
          import ro_repo
          data=json.loads(Path("snapshot-input-v1.json").read_text())
          ro_repo.validate_schema(data, "snapshot-input-v1")
          PY

      - name: Build and sign immutable candidate snapshot
        env:
          RO_REPO_METADATA_SIGNING_SUBKEY_B64: ${{ secrets.RO_REPO_METADATA_SIGNING_SUBKEY_B64 }}
          RO_REPO_METADATA_SIGNING_PASSPHRASE: ${{ secrets.RO_REPO_METADATA_SIGNING_PASSPHRASE }}
        shell: bash
        run: |
          set -euo pipefail
          set +x
          signing_tmp=""
          signing_home=""
          key_file=""
          passphrase_file=""
          cleanup() {
            set +e
            if [[ -n "$signing_home" ]]; then
              GNUPGHOME="$signing_home" gpgconf --kill gpg-agent >/dev/null 2>&1
            fi
            [[ -n "$key_file" ]] && rm -f -- "$key_file"
            [[ -n "$passphrase_file" ]] && rm -f -- "$passphrase_file"
            [[ -n "$signing_tmp" ]] && rm -rf -- "$signing_tmp"
          }
          trap cleanup EXIT

          signing_tmp="$(mktemp -d)"
          chmod 700 "$signing_tmp"
          signing_home="$signing_tmp/gnupg"
          key_file="$signing_tmp/metadata-signing-subkey.asc"
          passphrase_file="$signing_tmp/passphrase"
          mkdir -m 700 "$signing_home"
          umask 077
          printf '%s' "$RO_REPO_METADATA_SIGNING_SUBKEY_B64" | base64 --decode > "$key_file"
          printf '%s' "$RO_REPO_METADATA_SIGNING_PASSPHRASE" > "$passphrase_file"
          chmod 600 "$key_file" "$passphrase_file"
          unset RO_REPO_METADATA_SIGNING_SUBKEY_B64 RO_REPO_METADATA_SIGNING_PASSPHRASE
          GNUPGHOME="$signing_home" gpg --batch --import "$key_file"

          rpm_fingerprint="$(awk -F= '$1 == "RPM_SIGNING" {print $2}' keys/production/production-fingerprints.txt)"
          metadata_fingerprint="$(awk -F= '$1 == "METADATA_SIGNING" {print $2}' keys/production/production-fingerprints.txt)"

          parent_args=()
          if [[ -n "$PARENT_SNAPSHOT" ]]; then
            parent_args=(--parent "$PARENT_SNAPSHOT")
          fi

          tools/ro-repo build-production-snapshot \
            --components components \
            --source-runs snapshot-input-v1.json \
            --output out \
            --snapshot-id "$SNAPSHOT_ID" \
            --gnupghome "$signing_home" \
            --rpm-key-id "$rpm_fingerprint" \
            --metadata-key-id "$metadata_fingerprint" \
            --workflow-run "$GITHUB_RUN_ID" \
            --passphrase-file "$passphrase_file" \
            "${parent_args[@]}"

      - name: Upload immutable candidate snapshot
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: candidate-snapshot-${{ inputs.snapshot_id }}-${{ github.run_id }}
          path: out/snapshots/fedora/44/${{ inputs.snapshot_id }}/
          retention-days: 90
          if-no-files-found: error
