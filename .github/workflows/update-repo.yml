name: Update RPM Repository from Releases

on:
  workflow_dispatch: # Botu Actions sekmesinden manuel çalıştırmak için
  schedule:
    - cron: '0 0 * * *' # Her gece Gece Yarısı (00:00 UTC) çalışır

jobs:
  rebuild-repo:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Dosya yükleme yetkisi!

    steps:
      - name: Checkout ro-repo
        uses: actions/checkout@v7

      - name: Download Latest Release RPMs and Sort
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} 
        run: |
          # Gerekli tüm mimari klasörlerini oluşturuyoruz (SRPMS kaynak kodlar içindir)
          mkdir -p temp-downloads x86_64 noarch aarch64 SRPMS
          
          # 1. ro-Control reposundan RPM'leri indir
          echo "ro-Control paketleri indiriliyor..."
          gh release download --repo Project-Ro-ASD/ro-Control --pattern "*.rpm" --dir temp-downloads || echo "ro-Control için RPM bulunamadı veya hata oluştu."
          
          # 2. ro-Assist reposundan RPM'leri indir
          echo "ro-Assist paketleri indiriliyor..."
          gh release download --repo Project-Ro-ASD/ro-Assist --pattern "*.rpm" --dir temp-downloads || echo "ro-Assist için RPM bulunamadı veya hata oluştu."

          # 3. Ro-Theme paketlerini indir
          echo "Ro-Theme paketleri indiriliyor..."
          gh release download --repo Project-Ro-ASD/Ro-Theme --pattern "*.rpm" --dir temp-downloads || echo "Ro-Theme için RPM bulunamadı."
          
          # İnen dosyaları tam uzantılarına göre doğru klasörlere dağıtıyoruz
          for file in temp-downloads/*.rpm; do
            if [[ -f "$file" ]]; then
              if [[ "$file" == *".x86_64.rpm" ]]; then
                mv "$file" x86_64/
                echo "$(basename $file) -> x86_64/ klasörüne taşındı."
              elif [[ "$file" == *".aarch64.rpm" ]]; then
                mv "$file" aarch64/
                echo "$(basename $file) -> aarch64/ klasörüne taşındı."
              elif [[ "$file" == *".src.rpm" ]]; then
                mv "$file" SRPMS/
                echo "$(basename $file) -> SRPMS/ klasörüne taşındı."
              elif [[ "$file" == *".noarch.rpm" ]]; then
                mv "$file" noarch/
                echo "$(basename $file) -> noarch/ klasörüne taşındı."
              else
                echo "Bilinmeyen format, atlanıyor: $(basename $file)"
              fi
            fi
          done

          # Bilinen hatalı veya yanlış etiketlenmiş RPM'leri repoya alma
          rm -f \
            x86_64/ro-assist-0.1.1-.x86_64.rpm \
            noarch/ro-theme-1.0.5-1.fc43.noarch.rpm \
            SRPMS/ro-theme-1.0.5-1.fc43.src.rpm
          
          # İşimiz bitince geçici klasörü siliyoruz
          rm -rf temp-downloads
      

      - name: Check for RPM changes
        id: rpm_changes
        run: |
          if git status --porcelain --untracked-files=all -- x86_64/ noarch/ aarch64/ SRPMS/ | grep -qE '\.rpm$'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Yeni veya değişen RPM bulundu."
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "RPM değişikliği yok; metadata güncellenmeyecek."
          fi

      - name: Install createrepo_c
        if: steps.rpm_changes.outputs.changed == 'true'
        run: sudo apt-get update && sudo apt-get install -y createrepo-c

      - name: Rebuild Metadata for All Architectures
        if: steps.rpm_changes.outputs.changed == 'true'
        run: |
          createrepo_c x86_64/
          createrepo_c noarch/
          createrepo_c aarch64/
          createrepo_c SRPMS/

      - name: Commit and Push changes
        if: steps.rpm_changes.outputs.changed == 'true'
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add x86_64/ noarch/ aarch64/ SRPMS/
          git commit -m "Otomatik Güncelleme: RPM paketleri ve metadata güncellendi"
          git push
