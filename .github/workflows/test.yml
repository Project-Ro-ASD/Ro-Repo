name: Ro-Repo V2 tests
"on":
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  unit-policy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: sudo apt-get update && sudo apt-get install -y python3-jsonschema python3-yaml
      - run: python3 -m unittest discover -s tests -v
      - run: python3 -m py_compile tools/ro_repo.py

  fedora44-e2e:
    runs-on: ubuntu-24.04
    container: fedora:44
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install dependencies
        run: dnf -y install python3 python3-jsonschema rpm rpm-build rpm-sign createrepo_c dnf-plugins-core gnupg2 rpmlint gcc make jq python3-yaml
      - name: Run E2E Local
        run: tests/e2e-local.sh
      - name: Verify test-only V3 DNF receipt bundle integrity
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/v3_dnf_bundle_verify.py \
            --root v3-evidence \
            --expected-groups ro-control ro-atomic-fixture \
            --expected-repository "$GITHUB_REPOSITORY" \
            --expected-run-id "$GITHUB_RUN_ID" \
            --expected-commit "$GITHUB_SHA" \
            --expected-workflow-ref "$GITHUB_WORKFLOW_REF"
      - name: Upload test-only V3 DNF receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: v3-dnf-receipts-${{ github.run_id }}-${{ github.run_attempt }}
          path: v3-evidence/
          if-no-files-found: ignore
          retention-days: 14

  acceptance-runtime-contract:
    runs-on: ubuntu-24.04
    container: fedora:44
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install exact acceptance runtime
        shell: bash
        run: bash scripts/install_acceptance_tools.sh
      - name: Verify exact runtime executables
        shell: bash
        run: |
          set -euo pipefail
          for command_name in gh python3 rpm dnf bash sort awk base64 sha256sum; do
            command -v "$command_name" >/dev/null
          done
          dnf repoquery --help >/dev/null
      - name: Verify DNF5 package-name formatting
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/query_fedora_package_names.sh package-names.txt bash coreutils
          grep -qx 'bash' package-names.txt
          grep -qx 'coreutils' package-names.txt
          [[ "$(wc -l < package-names.txt)" -eq 2 ]]
      - name: Run acceptance runtime contract tests
        shell: bash
        run: python3 -m unittest tests.test_acceptance_runtime -v

  selected-stable-fedora44:
    runs-on: ubuntu-24.04
    container: fedora:44
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: dnf -y install python3 python3-jsonschema rpm rpm-build rpm-sign createrepo_c gnupg2 dnf5
      - name: V2 selected Stable real signed RPM and DNF5 regression
        run: python3 tests/selected-stable-e2e.py

  incremental-candidate-fedora44:
    runs-on: ubuntu-24.04
    container: fedora:44
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: dnf -y install python3 python3-jsonschema python3-rpm rpm rpm-build rpm-sign createrepo_c gnupg2 dnf5
      - name: V2 incremental candidate signed RPM and DNF5 regression
        run: python3 tests/candidate-expansion-e2e.py

  pinned-producer-candidate-fedora44:
    runs-on: ubuntu-24.04
    container: fedora:44
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: dnf -y install git gh jq python3 python3-jsonschema python3-rpm rpm rpm-build rpm-sign createrepo_c gnupg2 dnf5
      - name: Read exact historical production snapshot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 097ba6ba7ab73d87c36f7ec9829b017b083b1883
          path: actual/baseline
          persist-credentials: false
          sparse-checkout: snapshots/fedora/44/repo-f44-20261009-001
      - name: Read pinned immutable producer assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api repos/Project-Ro-ASD/ro-Installer/releases/417687254 > /tmp/installer-release.json
          jq -e '.immutable == true and .id == 417687254 and .tag_name == "v2.4.5"' /tmp/installer-release.json
          gh api repos/Project-Ro-ASD/Ro-Theme/releases/417133054 > /tmp/theme-release.json
          jq -e '.immutable == true and .id == 417133054 and .tag_name == "v1.1.5"' /tmp/theme-release.json
          gh release download v2.4.5 --repo Project-Ro-ASD/ro-Installer --dir actual/installer
          gh release download v1.1.5 --repo Project-Ro-ASD/Ro-Theme --dir actual/theme
      - name: Real producer payload install and upgrade with disposable signing keys
        env:
          RO_CANDIDATE_ACTUAL_INPUTS: ${{ github.workspace }}/actual
        run: python3 tests/candidate-expansion-e2e.py
